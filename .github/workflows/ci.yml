name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build with placeholder env vars: Vite inlines import.meta.env at build
      # time, and a missing VITE_* var is a silent empty string rather than an
      # error, so real credentials aren't needed to catch a broken build.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
