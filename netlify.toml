[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build when a commit touches only supabase/, .github/, .claude/ or
  # markdown. Exit 0 means "ignore"; any non-zero exit means "build".
  #
  # Compares against the commit's own first parent, NOT $CACHED_COMMIT_REF.
  # The cache is shared across deploy contexts, so a Deploy Preview building a
  # PR head leaves CACHED_COMMIT_REF pointing at that head. The production build
  # that follows the merge then compares the merge commit against the PR head it
  # just built — an identical tree — which exits 0 and cancels production. Every
  # production deploy from 2 July onward was cancelled that way, while previews
  # succeeded, so socion.app silently stopped updating while PRs looked fine.
  #
  # $COMMIT_REF^ is context-independent: on a merge commit it's the previous
  # main, on a branch push it's the previously built head. An initial commit
  # with no parent makes git diff error non-zero, which builds.
  ignore = "git diff --quiet \"$COMMIT_REF^\" \"$COMMIT_REF\" -- . ':!supabase' ':!.github' ':!.claude' ':!*.md'"

[[redirects]]
  from = "https://socionics-match.netlify.app/*"
  to = "https://socion.app/:splat"
  status = 301
  force = true

# Latest-articles widgets (src/lib/siArticles.js). Proxied rather than fetched
# cross-origin so it works regardless of socionicsinsight.com's CORS headers.
# Must sit above the SPA catch-all.
[[redirects]]
  from = "/si-feed.xml"
  to = "https://www.socionicsinsight.com/feed.xml"
  status = 200
  force = true

# Paths that only exist in the repo, never in dist/. Without these the SPA
# catch-all below answers them with the home shell and a 200, which crawlers
# treat as real pages (soft 404s).
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Headers ──────────────────────────────────────────────────────────────────
# Netlify adds HSTS on its own; the rest are set here. No Content-Security-Policy
# yet: the page talks to Supabase, Stripe, Google (OAuth and fonts), Giphy, Umami
# and the socionicsinsight.com iframe, so a CSP needs a report-only trial first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.stripe.com\")"
    X-Frame-Options = "DENY"

# Vite content-hashes everything under /assets/, so a year is safe.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell, the service worker and the manifest must always revalidate, or a
# deploy can be pinned in a browser (and, through sw.js, in the offline cache).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Unhashed public images (icons, OG image, screenshots): a day.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
